version: '3.8'

networks:
  fintech-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

services:
  # Shared Ledger and Operations Database
  db:
    image: postgres:15-alpine
    container_name: fintech-db
    environment:
      POSTGRES_USER: fineract
      POSTGRES_PASSWORD: fineract_password
      POSTGRES_DB: fineract_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fintech-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fineract -d fineract_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Apache Fineract - Custom Java/Spring Boot App Tier
  fineract-core:
    build:
      context: ./fineract-customization
      dockerfile: Dockerfile
    container_name: fineract-core
    ports:
      - "8443:8443"
    environment:
      - FINERACT_DEFAULT_TENANTDB_HOSTNAME=db
      - FINERACT_DEFAULT_TENANTDB_PORT=5432
      - FINERACT_DEFAULT_TENANTDB_USERNAME=fineract
      - FINERACT_DEFAULT_TENANTDB_PASSWORD=fineract_password
      - FINERACT_DEFAULT_TENANTDB_CONN_PARAMS=useSSL=false
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fintech-network

  # Integration Service - Python Middleman
  integration-service:
    build:
      context: ./integration-service
      dockerfile: Dockerfile
    container_name: integration-service
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://fineract:fineract_password@db:5432/fineract_db
      - FINERACT_BASE_URL=https://fineract-core:8443/fineract-provider/api/v1
    depends_on:
      - db
      - fineract-core
    networks:
      - fintech-network

  # Mock ERP - Python Chart of Accounts Master
  mock-erp:
    build:
      context: ./mock-erp
      dockerfile: Dockerfile
    container_name: mock-erp
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://fineract:fineract_password@db:5432/fineract_db
    depends_on:
      - db
    networks:
      - fintech-network
