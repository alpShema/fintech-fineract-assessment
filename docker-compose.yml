# fintech-fineract-assessment — docker-compose.yml
#
# Phase 0 scope: Postgres + the customized-Fineract build pipeline, proven
# end to end before any Part A Java changes land (fineract.patch is
# currently empty, so this builds the *unmodified* pinned 1.10.0 tag).
#
# integration-service and mock-erp are scaffolded (see their directories)
# but not wired in here yet -- added once they have something to run.

services:
  db:
    image: postgres:16.1
    restart: always
    env_file:
      - ./fineract/env/postgresql.env
    volumes:
      - ./fineract/postgresql-init/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - fineract-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "postgres", "-U", "root"]
      timeout: 10s
      retries: 10
    ports:
      - "5432:5432"

  fineract:
    build:
      context: ./fineract-customization
      args:
        FINERACT_TAG: "1.10.0"
    image: fintech-fineract-assessment/fineract-custom:1.10.0
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./fineract/env/fineract.env
      - ./fineract/env/fineract-common.env
      - ./fineract/env/fineract-postgresql.env
    ports:
      - "8443:8443"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 8443"]
      interval: 10s
      timeout: 5s
      retries: 60

volumes:
  fineract-db-data:
