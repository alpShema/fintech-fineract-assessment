[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's own canonical dependency-injection pattern -- see mock-erp's
# pyproject.toml for the full explanation.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
